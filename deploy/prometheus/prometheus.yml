global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "plumora-backend"
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: "node"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187
